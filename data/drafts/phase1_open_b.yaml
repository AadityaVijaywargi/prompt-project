- item_id: mtb-hum-06
  source_id: "14125357"
  en: >-
    Here are five artworks and ideas for making them interactive for children. 1. Van Gogh's "The Starry Night":
    children paint their own swirling night sky and add glow-in-the-dark stars. 2. Leonardo da Vinci's "Mona Lisa": a
    guessing game about what she might be thinking, with children acting out different expressions. 3. Hokusai's "The
    Great Wave off Kanagawa": a sensory corner with blue fabric "waves" and stories about the fishermen in the boats.
    4. Seurat's "A Sunday on La Grande Jatte": dot painting with cotton buds to show how small dots form a picture.
    5. Frida Kahlo's self-portraits: children create self-portraits with symbols of things they love.
  hi: >-
    यहाँ पाँच कलाकृतियाँ और उन्हें बच्चों के लिए संवादात्मक बनाने के विचार दिए गए हैं। 1. वैन गॉग की "द स्टारी नाइट": बच्चे
    घुमावदार रात के आसमान का अपना चित्र बनाएँ और अँधेरे में चमकने वाले तारे लगाएँ। 2. लियोनार्डो दा विंची की "मोना लिसा": एक
    अनुमान लगाने वाला खेल कि वह क्या सोच रही होगी, जिसमें बच्चे अलग-अलग भाव अभिनय करके दिखाएँ। 3. होकुसाई की "द ग्रेट वेव ऑफ़
    कानागावा": नीले कपड़े की "लहरों" वाला एक संवेदी कोना और नावों में बैठे मछुआरों की कहानियाँ। 4. स्यूरा की "अ संडे ऑन ला
    ग्रांड जात": रुई की तीलियों से बिंदु-चित्रकारी, यह दिखाने के लिए कि छोटे बिंदु मिलकर कैसे चित्र बनाते हैं। 5. फ़्रीडा काहलो के
    आत्म-चित्र: बच्चे अपनी पसंद की चीज़ों के प्रतीकों के साथ अपने आत्म-चित्र बनाएँ।
  hi_rom: >-
    Yahaan paanch kalaakritiyaan aur unhein bachchon ke liye samvaadaatmak banaane ke vichaar diye gaye hain. 1. Van
    Gogh ki "The Starry Night": bachche ghumaavdaar raat ke aasmaan ka apna chitra banaayein aur andhere mein chamakne
    waale taare lagaayein. 2. Leonardo da Vinci ki "Mona Lisa": ek anumaan lagaane waala khel ki vah kya soch rahi
    hogi, jismein bachche alag-alag bhaav abhinay karke dikhaayein. 3. Hokusai ki "The Great Wave off Kanagawa": neele
    kapde ki "lehron" waala ek samvedi kona aur naavon mein baithe machhuaaron ki kahaaniyaan. 4. Seurat ki "A Sunday on
    La Grande Jatte": rui ki teeliyon se bindu-chitrakaari, yah dikhaane ke liye ki chhote bindu milkar kaise chitra
    banaate hain. 5. Frida Kahlo ke aatm-chitra: bachche apni pasand ki cheezon ke prateekon ke saath apne aatm-chitra
    banaayein.
  hinglish: >-
    Yahan paanch artworks aur unhe bachchon ke liye interactive banane ke ideas hain. 1. Van Gogh ki "The Starry Night":
    bachche apna swirling night sky paint karein aur glow-in-the-dark stars lagayein. 2. Leonardo da Vinci ki "Mona
    Lisa": ek guessing game ki woh kya soch rahi hogi, jismein bachche alag-alag expressions act karke dikhayein.
    3. Hokusai ki "The Great Wave off Kanagawa": blue fabric ki "waves" wala ek sensory corner aur boats mein baithe
    fishermen ki stories. 4. Seurat ki "A Sunday on La Grande Jatte": cotton buds se dot painting, ye dikhane ke liye ki
    chhote dots milkar kaise picture banate hain. 5. Frida Kahlo ke self-portraits: bachche apni favourite cheezon ke
    symbols ke saath apne self-portraits banayein.

- item_id: mtb-write-01
  source_id: "3075696"
  en: >-
    Old Mrs. Kapoor sold umbrellas on a corner where it never seemed to rain. She was as small and wrinkled as a dried
    apricot, but her eyes flashed like wet pebbles in sunlight. Her shawl was a patchwork of forty colours, each square
    stitched, she claimed, from a different country she had never visited. She laughed in sudden bursts, like a kettle
    boiling over, and she knew every passer-by's secret before they told it. Children swore that her umbrellas opened
    onto other skies: one full of snow, one of falling petals, one of stars.
  hi: >-
    बूढ़ी श्रीमती कपूर एक ऐसे नुक्कड़ पर छाते बेचती थीं जहाँ कभी बारिश होती ही नहीं लगती थी। वे सूखी खुबानी जितनी छोटी और
    झुर्रीदार थीं, लेकिन उनकी आँखें धूप में भीगे कंकड़ों की तरह चमकती थीं। उनकी शॉल चालीस रंगों के टुकड़ों को जोड़कर बनी थी, और
    उनका दावा था कि हर चौकोर टुकड़ा किसी ऐसे देश से सिला गया था जहाँ वे कभी नहीं गई थीं। वे अचानक ठहाके लगाकर हँसती थीं, जैसे
    उबलती केतली छलक पड़े, और हर राहगीर का राज़ उसके बताने से पहले ही जान लेती थीं। बच्चे कसम खाते थे कि उनके छाते दूसरे
    आसमानों में खुलते हैं: एक बर्फ़ से भरा, एक गिरती पंखुड़ियों से, और एक तारों से।
  hi_rom: >-
    Boodhi Shrimati Kapoor ek aise nukkad par chhaate bechti thin jahaan kabhi baarish hoti hi nahi lagti thi. Ve
    sookhi khubaani jitni chhoti aur jhurreedaar thin, lekin unki aankhein dhoop mein bheege kankadon ki tarah chamakti
    thin. Unki shawl chaalees rangon ke tukdon ko jodkar bani thi, aur unka daava tha ki har chaukor tukda kisi aise
    desh se sila gaya tha jahaan ve kabhi nahi gayi thin. Ve achaanak thahaake lagaakar hansti thin, jaise ubalti
    ketli chhalak pade, aur har raahgeer ka raaz uske bataane se pehle hi jaan leti thin. Bachche kasam khaate the ki
    unke chhaate doosre aasmaanon mein khulte hain: ek barf se bhara, ek girti pankhudiyon se, aur ek taaron se.
  hinglish: >-
    Boodhi Mrs. Kapoor ek aise corner par umbrellas bechti thi jahan kabhi baarish hoti hi nahi lagti thi. Woh ek dried
    apricot jitni chhoti aur wrinkled thi, lekin unki aankhein sunlight mein wet pebbles ki tarah chamakti thi. Unka
    shawl forty colours ke patches ko jodkar bana tha, aur unka claim tha ki har square kisi aise country se stitch
    kiya gaya tha jahan woh kabhi nahi gayi thi. Woh achanak bursts mein hasti thi, jaise boiling kettle overflow ho
    jaaye, aur har passer-by ka secret uske batane se pehle hi jaan leti thi. Bachche kasam khaate the ki unke
    umbrellas doosre skies mein khulte hain: ek snow se bhara, ek falling petals se, aur ek stars se.

- item_id: mtb-write-02
  source_id: "38622539"
  en: >-
    The marketplace hummed from the first light of morning. Sacks of turmeric and red chilli powder glowed like small
    hills of sunset, and the air was thick with the smell of cardamom, frying pakoras and ripe mangoes. Vendors shouted
    prices over one another, a radio crackled with an old film song, and somewhere a pressure cooker whistled. Bright
    saris fluttered from wooden poles, brass pots flashed in the sun, and a cow wandered calmly between the stalls.
    Coins clinked, children tugged at their parents' hands, and every few steps the crowd parted for a cart piled high
    with cauliflowers.
  hi: >-
    बाज़ार सुबह की पहली रोशनी से ही गुनगुनाने लगा था। हल्दी और लाल मिर्च पाउडर की बोरियाँ सूर्यास्त की छोटी पहाड़ियों जैसी चमक
    रही थीं, और हवा इलायची, तलते पकौड़ों और पके आमों की गंध से भरी थी। विक्रेता एक-दूसरे से ऊँची आवाज़ में दाम पुकार रहे थे, एक
    रेडियो पर पुराना फ़िल्मी गीत खरखराते हुए बज रहा था, और कहीं प्रेशर कुकर की सीटी बजी। लकड़ी के खंभों से रंग-बिरंगी साड़ियाँ
    लहरा रही थीं, पीतल के बर्तन धूप में चमक रहे थे, और एक गाय दुकानों के बीच आराम से घूम रही थी। सिक्के खनक रहे थे, बच्चे अपने
    माता-पिता का हाथ खींच रहे थे, और हर कुछ कदम पर भीड़ फूलगोभियों से लदी एक गाड़ी के लिए रास्ता दे देती थी।
  hi_rom: >-
    Baazaar subah ki pehli roshni se hi gungunaane laga tha. Haldi aur laal mirch powder ki boriyaan sooryaast ki chhoti
    pahaadiyon jaisi chamak rahi thin, aur hawa ilaayachi, talte pakodon aur pake aamon ki gandh se bhari thi. Vikreta
    ek-doosre se oonchi aawaaz mein daam pukaar rahe the, ek radio par puraana filmi geet kharkharaate hue baj raha tha,
    aur kahin pressure cooker ki seeti baji. Lakdi ke khambhon se rang-birangi saadiyaan lehra rahi thin, peetal ke
    bartan dhoop mein chamak rahe the, aur ek gaay dukaanon ke beech aaraam se ghoom rahi thi. Sikke khanak rahe the,
    bachche apne maata-pita ka haath kheench rahe the, aur har kuch kadam par bheed phoolgobhiyon se ladi ek gaadi ke
    liye raasta de deti thi.
  hinglish: >-
    Market subah ki pehli light se hi hum karne laga tha. Turmeric aur red chilli powder ke sacks sunset ki chhoti hills
    jaise glow kar rahe the, aur hawa cardamom, frying pakoras aur ripe mangoes ki smell se bhari thi. Vendors
    ek-doosre se zor se prices shout kar rahe the, ek radio par purana film song crackle karte hue baj raha tha, aur
    kahin pressure cooker ki whistle baji. Wooden poles se bright saris flutter kar rahi thi, brass pots sun mein chamak
    rahe the, aur ek cow stalls ke beech aaram se ghoom rahi thi. Coins clink kar rahe the, bachche apne parents ka
    haath kheench rahe the, aur har kuch steps par crowd cauliflowers se ladi ek cart ke liye raasta de deti thi.

- item_id: mtb-write-03
  source_id: "29742357"
  en: >-
    Maya woke to the smell of her grandmother's cooking, which was strange, because her grandmother had died eleven
    years ago. The calendar on the kitchen wall said 2009, her phone was a clunky brick with no internet, and in the
    mirror a ten-year-old girl stared back at her with Maya's own frightened eyes. By noon she had discovered the rule:
    whenever she fell asleep thinking of a date, she woke up inside it. By evening she had discovered the problem. Every
    time she went back, something in the present had changed, and this time, her younger brother no longer existed.
  hi: >-
    माया की आँख अपनी दादी के खाने की खुशबू से खुली, जो अजीब था, क्योंकि उसकी दादी को गुज़रे ग्यारह साल हो चुके थे। रसोई की दीवार
    पर लगा कैलेंडर 2009 दिखा रहा था, उसका फ़ोन बिना इंटरनेट वाला एक भारी-भरकम डिब्बा था, और आईने में दस साल की एक लड़की माया
    की ही डरी हुई आँखों से उसे घूर रही थी। दोपहर तक उसने नियम खोज लिया: जब भी वह किसी तारीख के बारे में सोचते हुए सोती, उसी
    तारीख में जागती। शाम तक उसने समस्या भी खोज ली। हर बार जब वह पीछे जाती, वर्तमान में कुछ बदल जाता, और इस बार उसका छोटा भाई
    अब अस्तित्व में ही नहीं था।
  hi_rom: >-
    Maya ki aankh apni daadi ke khaane ki khushboo se khuli, jo ajeeb tha, kyonki uski daadi ko guzre gyaarah saal ho
    chuke the. Rasoi ki deewaar par laga calendar 2009 dikha raha tha, uska phone bina internet waala ek
    bhaari-bharkam dibba tha, aur aaine mein das saal ki ek ladki Maya ki hi dari hui aankhon se use ghoor rahi thi.
    Dopahar tak usne niyam khoj liya: jab bhi vah kisi taareekh ke baare mein sochte hue soti, usi taareekh mein
    jaagti. Shaam tak usne samasya bhi khoj li. Har baar jab vah peechhe jaati, vartamaan mein kuch badal jaata, aur is
    baar uska chhota bhai ab astitva mein hi nahi tha.
  hinglish: >-
    Maya ki aankh apni grandmother ki cooking ki smell se khuli, jo strange tha, kyunki uski grandmother ko gaye eleven
    saal ho chuke the. Kitchen ki wall par laga calendar 2009 dikha raha tha, uska phone bina internet wala ek bulky
    brick tha, aur mirror mein ek ten-year-old girl Maya ki hi scared aankhon se use ghoor rahi thi. Dopahar tak usne
    rule discover kar liya: jab bhi woh kisi date ke baare mein sochte hue soti, usi date mein wake up karti. Shaam tak
    usne problem bhi discover kar li. Har baar jab woh peeche jaati, present mein kuch change ho jaata, aur is baar uska
    younger brother exist hi nahi karta tha.

- item_id: mtb-write-04
  source_id: "49723273"
  en: >-
    Subject: Feedback request on the Quarterly Financial Report. Dear Ms. Sharma, I have completed the Quarterly
    Financial Report and would value your feedback before it is circulated. In particular, could you let me know
    whether the data analysis is sound, whether the presentation style and charts are clear and professional, and
    whether the conclusions follow clearly from the figures? I would be grateful for any comments by Friday. Thank you
    for your time. Best regards, Rahul
  hi: >-
    विषय: त्रैमासिक वित्तीय रिपोर्ट पर प्रतिक्रिया का अनुरोध। आदरणीय सुश्री शर्मा, मैंने त्रैमासिक वित्तीय रिपोर्ट पूरी कर ली है और
    इसे वितरित करने से पहले आपकी प्रतिक्रिया जानना चाहूँगा। विशेष रूप से, क्या आप बता सकती हैं कि आँकड़ों का विश्लेषण ठोस है या
    नहीं, प्रस्तुति की शैली और आरेख स्पष्ट और पेशेवर हैं या नहीं, और निष्कर्ष आँकड़ों से स्पष्ट रूप से निकलते हैं या नहीं?
    शुक्रवार तक आपकी कोई भी टिप्पणी मिल जाए तो मैं आभारी रहूँगा। आपके समय के लिए धन्यवाद। सादर, राहुल
  hi_rom: >-
    Vishay: Traimaasik Vitteeya Report par pratikriya ka anurodh. Aadaraneeya Sushri Sharma, maine traimaasik vitteeya
    report poori kar li hai aur ise vitarit karne se pehle aapki pratikriya jaanna chaahoonga. Vishesh roop se, kya
    aap bata sakti hain ki aankadon ka vishleshan thos hai ya nahi, prastuti ki shaili aur aarekh spasht aur peshevar
    hain ya nahi, aur nishkarsh aankadon se spasht roop se nikalte hain ya nahi? Shukravaar tak aapki koi bhi tippani
    mil jaaye to main aabhaari rahoonga. Aapke samay ke liye dhanyavaad. Saadar, Rahul
  hinglish: >-
    Subject: Quarterly Financial Report par feedback request. Dear Ms. Sharma, maine Quarterly Financial Report complete
    kar li hai aur ise circulate karne se pehle aapka feedback chahta hoon. Specifically, kya aap bata sakti hain ki
    data analysis solid hai ya nahi, presentation style aur charts clear aur professional hain ya nahi, aur conclusions
    figures se clearly nikalte hain ya nahi? Friday tak aapke koi bhi comments mil jaayein toh main grateful rahunga.
    Aapke time ke liye thank you. Best regards, Rahul

- item_id: mtb-role-01
  source_id: "84856299"
  en: >-
    A language model is a computer program that has learned how language works by reading a huge amount of text. Its
    basic skill is predicting which word is likely to come next in a sentence, and by doing this over and over it can
    answer questions, summarise documents or write emails. It is mostly trained on unlabelled data: ordinary text from
    books and websites, where the "answer" for each step is simply the next word already in the text, so no one has to
    label it by hand. Many models are then fine-tuned with a smaller amount of labelled or human-rated examples to make
    them more helpful and safe.
  hi: >-
    भाषा मॉडल एक कंप्यूटर प्रोग्राम है जिसने बहुत बड़ी मात्रा में पाठ पढ़कर सीखा है कि भाषा कैसे काम करती है। उसका बुनियादी कौशल
    यह अनुमान लगाना है कि किसी वाक्य में अगला शब्द कौन-सा होगा, और यह बार-बार करके वह प्रश्नों के उत्तर दे सकता है, दस्तावेज़ों का
    सारांश बना सकता है या ईमेल लिख सकता है। इसे मुख्य रूप से बिना लेबल वाले आँकड़ों पर प्रशिक्षित किया जाता है: किताबों और
    वेबसाइटों का साधारण पाठ, जहाँ हर चरण का "उत्तर" बस पाठ में पहले से मौजूद अगला शब्द होता है, इसलिए किसी को हाथ से लेबल लगाने
    की ज़रूरत नहीं पड़ती। इसके बाद कई मॉडलों को कम संख्या में लेबल वाले या मनुष्यों द्वारा आँके गए उदाहरणों से परिष्कृत किया जाता
    है, ताकि वे अधिक मददगार और सुरक्षित बनें।
  hi_rom: >-
    Bhasha model ek computer program hai jisne bahut badi maatra mein paath padhkar seekha hai ki bhasha kaise kaam
    karti hai. Uska buniyaadi kaushal yah anumaan lagaana hai ki kisi vaakya mein agla shabd kaun-sa hoga, aur yah
    baar-baar karke vah prashnon ke uttar de sakta hai, dastaavezon ka saaraansh bana sakta hai ya email likh sakta
    hai. Ise mukhya roop se bina label waale aankadon par prashikshit kiya jaata hai: kitaabon aur websiteon ka
    saadhaaran paath, jahaan har charan ka "uttar" bas paath mein pehle se maujood agla shabd hota hai, isliye kisi ko
    haath se label lagaane ki zaroorat nahi padti. Iske baad kai modelon ko kam sankhya mein label waale ya manushyon
    dwara aanke gaye udaaharanon se parishkrit kiya jaata hai, taaki ve adhik madadgaar aur surakshit banein.
  hinglish: >-
    Language model ek computer program hai jisne bahut zyada text padhkar seekha hai ki language kaise kaam karti hai.
    Uski basic skill ye predict karna hai ki kisi sentence mein next word kaunsa hoga, aur ye baar-baar karke woh
    questions ke answers de sakta hai, documents summarise kar sakta hai ya emails likh sakta hai. Ise mostly
    unlabelled data par train kiya jaata hai: books aur websites ka normal text, jahan har step ka "answer" bas text
    mein pehle se maujood next word hota hai, isliye kisi ko haath se label karne ki zaroorat nahi padti. Iske baad kai
    models ko thode labelled ya humans dwara rate kiye gaye examples se fine-tune kiya jaata hai, taaki woh zyada
    helpful aur safe banein.

- item_id: mtb-role-02
  source_id: "54595143"
  en: >-
    For a hundred years I have stood here, watching seasons turn, sheltering birds in my branches and giving shade to
    every traveller who rested against my trunk. When the first axe bites into my bark, I feel shock more than pain, a
    deep shudder that runs from my roots to my highest leaves. Then comes sorrow: for the nests that will fall, for the
    squirrels who will lose their home, and for the soil my roots have held together. I cannot run or shout, so I can
    only hope that someone will remember that a forest is not just wood, but a living community that took centuries to
    grow.
  hi: >-
    सौ वर्षों से मैं यहाँ खड़ा हूँ, ऋतुओं को बदलते देखता रहा हूँ, अपनी शाखाओं में पक्षियों को आश्रय देता रहा हूँ और मेरे तने से टेक
    लगाकर सुस्ताने वाले हर राही को छाया देता रहा हूँ। जब पहली कुल्हाड़ी मेरी छाल में धँसती है, तो मुझे दर्द से अधिक सदमा लगता है, एक
    गहरी कँपकँपी जो मेरी जड़ों से लेकर सबसे ऊँची पत्तियों तक दौड़ जाती है। फिर दुःख आता है: उन घोंसलों के लिए जो गिर जाएँगे, उन
    गिलहरियों के लिए जिनका घर छिन जाएगा, और उस मिट्टी के लिए जिसे मेरी जड़ों ने थाम रखा था। मैं न भाग सकता हूँ, न चिल्ला सकता हूँ,
    इसलिए बस यह आशा कर सकता हूँ कि कोई याद रखेगा कि जंगल केवल लकड़ी नहीं, बल्कि एक जीवित समुदाय है जिसे बढ़ने में सदियाँ लगीं।
  hi_rom: >-
    Sau varshon se main yahaan khada hoon, rituon ko badalte dekhta raha hoon, apni shaakhaaon mein pakshiyon ko
    aashray deta raha hoon aur mere tane se tek lagaakar sustaane waale har raahi ko chhaaya deta raha hoon. Jab pehli
    kulhaadi meri chhaal mein dhansti hai, to mujhe dard se adhik sadma lagta hai, ek gehri kanpkanpi jo meri jadon se
    lekar sabse oonchi pattiyon tak daud jaati hai. Phir dukh aata hai: un ghonslon ke liye jo gir jaayenge, un
    gilahariyon ke liye jinka ghar chhin jaayega, aur us mitti ke liye jise meri jadon ne thaam rakha tha. Main na
    bhaag sakta hoon, na chilla sakta hoon, isliye bas yah aasha kar sakta hoon ki koi yaad rakhega ki jangal keval
    lakdi nahi, balki ek jeevit samudaay hai jise badhne mein sadiyaan lagin.
  hinglish: >-
    Hundred saalon se main yahan khada hoon, seasons ko change hote dekhta raha hoon, apni branches mein birds ko
    shelter deta raha hoon aur mere trunk se tek lagakar rest karne wale har traveller ko shade deta raha hoon. Jab
    pehli axe meri bark mein ghusti hai, toh mujhe pain se zyada shock lagta hai, ek deep shudder jo meri roots se
    lekar sabse oonchi leaves tak daud jaata hai. Phir sadness aati hai: un nests ke liye jo gir jaayenge, un squirrels
    ke liye jinka ghar chhin jaayega, aur us soil ke liye jise meri roots ne hold karke rakha tha. Main na bhaag sakta
    hoon, na chilla sakta hoon, isliye bas ye hope kar sakta hoon ki koi yaad rakhega ki forest sirf wood nahi, balki
    ek living community hai jise grow hone mein centuries lagi.

