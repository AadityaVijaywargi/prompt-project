[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lb-auditor"
version = "0.1.0"
description = "Language-bias auditor for LLM judges: English vs Hindi vs Romanized Hindi vs Hinglish"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "httpx>=0.25",
]

[project.optional-dependencies]
app = ["gradio>=4.0"]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
